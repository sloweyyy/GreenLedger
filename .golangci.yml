version: "2"
run:
  build-tags:
    - integration
    - e2e
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
  path-prefix: ""
linters:
  default: none
  enable:
    # goconst is intentionally disabled: most repeated literals here are
    # context-specific HTTP error messages and seed-data labels that should not
    # be coalesced into shared constants. Revisit per-package if it becomes useful.
    - bodyclose
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    dogsled:
      max-blank-identifiers: 2
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - io/ioutil.ReadFile
        - io.Copy(*bytes.Buffer)
        - io.Copy(os.Stdout)
    gocritic:
      enabled-checks:
        - commentedOutCode
        - nilValReturn
      disabled-checks:
        # Fires on `defer x.Close()` followed by log.Fatal* in service
        # entrypoints. On a fatal startup error the process exits immediately and
        # the OS reclaims the resources, so the skipped defer is harmless.
        - exitAfterDefer
    gocyclo:
      min-complexity: 15
    godox:
      keywords:
        - NOTE
        - OPTIMIZE
        - HACK
        - TODO
        - BUG
        - FIXME
    govet:
      settings:
        printf:
          funcs:
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Fatalf
    lll:
      line-length: 120
    misspell:
      locale: US
      ignore-rules:
        - someword
    nakedret:
      max-func-lines: 30
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    unparam:
      check-exported: false
    unused:
      field-writes-are-uses: true
      exported-fields-are-used: true
      parameters-are-used: true
      local-variables-are-used: true
      generated-is-used: true
    whitespace:
      multi-if: false
      multi-func: false
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - errcheck
          - goconst
          - gosec
          - lll
          - mnd
        path: _test\.go
      - linters:
          - gosec
        text: 'G204: Subprocess launched with variable'
      - linters:
          - lll
        source: '^//go:generate '
      - path: (.+)\.go$
        text: 'G404: Use of weak random number generator'
      - path: (.+)\.go$
        text: 'G204: Subprocess launched with variable'
      # Errors from Close() on cleanup/shutdown paths are not actionable.
      - linters:
          - errcheck
          - gosec
        source: '\.Close\(\)'
      # csv.Writer buffers writes; errors are surfaced via Flush()/Error(),
      # which the renderers check explicitly.
      - linters:
          - errcheck
          - gosec
        path: report_renderer\.go
        source: 'writer\.Write\('
      # revive: the codebase does not require a doc comment on every exported
      # symbol; package-level comments (added) are kept, per-symbol ones are not.
      - linters:
          - revive
        text: '^exported:'
      # revive: framework callback signatures (e.g. GORM hooks, jwt keyfuncs)
      # must keep their parameters even when unused.
      - linters:
          - revive
        text: '^unused-parameter:'
    paths:
      - .*\.pb\.go$
      - .*_mock\.go$
      - wire_gen\.go$
      - vendor
      - testdata
      - tmp
      - bin
      - dist
      - node_modules
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 3
  uniq-by-line: true
  new-from-rev: ""
  new-from-patch: ""
  new: false
  fix: false
severity:
  default: error
  rules:
    - linters:
        - dupl
      severity: info
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/sloweyyy/GreenLedger
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$
      - .*_mock\.go$
      - wire_gen\.go$
      - vendor
      - testdata
      - tmp
      - bin
      - dist
      - node_modules
      - third_party$
      - builtin$
      - examples$
