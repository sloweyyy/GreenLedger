# Gitleaks configuration file
# This file configures the Gitleaks secret scanner to reduce false positives

[extend]
# Use the default gitleaks configuration as a base
useDefault = true

[allowlist]
description = "Allowlist for false positives"

# Allow placeholder values in documentation
regexes = [
  '''(YOUR_JWT_TOKEN_HERE|PLACEHOLDER_JWT_TOKEN_FOR_TESTING_ONLY|your-jwt-token-here)''',
  '''Authorization: Bearer (YOUR_JWT_TOKEN_HERE|PLACEHOLDER_JWT_TOKEN_FOR_TESTING_ONLY|<your-jwt-token-here>)''',
  '''Bearer (YOUR_JWT_TOKEN_HERE|PLACEHOLDER_JWT_TOKEN_FOR_TESTING_ONLY)'''
]

# Allow test files and documentation with mock data
paths = [
  '''scripts/test-.*\.sh$''',
  '''.*\.md$''',
  '''.*test.*\.go$''',
  '''.*_test\.go$'''
]

# Specific files that are known to be safe
files = [
  "SYSTEM_STATUS.md",
  "scripts/test-calculator.sh"
]
